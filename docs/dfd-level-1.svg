<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <rect width="1600" height="980" fill="#f8fafc"/>
  <text x="800" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">DFD Level 1 - Sistem BEKUKU</text>
  <text x="800" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Setiap panah menunjukkan arah aliran data</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L11,4 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- External entities -->
  <g font-family="Arial, sans-serif" stroke="#1e293b" stroke-width="2">
    <rect x="20" y="130" width="210" height="78" rx="4" fill="#2563eb"/>
    <rect x="20" y="300" width="210" height="78" rx="4" fill="#2563eb"/>
    <rect x="20" y="470" width="210" height="78" rx="4" fill="#2563eb"/>
    <rect x="1370" y="130" width="210" height="78" rx="4" fill="#059669"/>
    <rect x="1370" y="300" width="210" height="78" rx="4" fill="#059669"/>
    <rect x="1370" y="470" width="210" height="78" rx="4" fill="#d97706"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">
    <text x="125" y="176">Admin</text>
    <text x="125" y="346">Kasir</text>
    <text x="125" y="516">Petugas Gudang</text>
    <text x="1475" y="176">Supplier</text>
    <text x="1475" y="346">Customer</text>
    <text x="1475" y="516">Midtrans</text>
  </g>

  <!-- Processes -->
  <g font-family="Arial, sans-serif" stroke="#0369a1" stroke-width="3" fill="#e0f2fe">
    <ellipse cx="430" cy="170" rx="150" ry="75"/>
    <ellipse cx="430" cy="340" rx="150" ry="75"/>
    <ellipse cx="430" cy="510" rx="150" ry="75"/>
    <ellipse cx="800" cy="170" rx="150" ry="75"/>
    <ellipse cx="800" cy="340" rx="150" ry="75"/>
    <ellipse cx="800" cy="510" rx="150" ry="75"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0c4a6e" font-size="15" font-weight="700">
    <text x="430" y="148">1.0</text>
    <text x="430" y="172">Autentikasi</text>
    <text x="430" y="194">&amp; Pengguna</text>
    <text x="430" y="318">2.0</text>
    <text x="430" y="342">Data Master</text>
    <text x="430" y="364">Kategori / Supplier</text>
    <text x="430" y="488">3.0</text>
    <text x="430" y="512">Pembelian</text>
    <text x="430" y="534">&amp; Batch</text>
    <text x="800" y="148">4.0</text>
    <text x="800" y="172">Penjualan</text>
    <text x="800" y="194">&amp; Pembayaran</text>
    <text x="800" y="318">5.0</text>
    <text x="800" y="342">Pengelolaan</text>
    <text x="800" y="364">Stok FEFO</text>
    <text x="800" y="488">6.0</text>
    <text x="800" y="512">Pelaporan</text>
    <text x="800" y="534">&amp; Audit</text>
  </g>

  <!-- Arrows from left actors -->
  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M230 169 H280"/>
    <path d="M230 339 H280"/>
    <path d="M230 509 H280"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#334155">
    <text x="238" y="158">Kredensial</text>
    <text x="238" y="328">Data master</text>
    <text x="238" y="498">Data pembelian</text>
  </g>

  <!-- Process-to-process flow -->
  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M580 170 H650"/>
    <path d="M580 340 H650"/>
    <path d="M580 510 H650"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#334155">
    <text x="586" y="158">Sesi aktif</text>
    <text x="586" y="328">Data master</text>
    <text x="586" y="498">Header pembelian</text>
  </g>

  <!-- Process-to-process vertical flow -->
  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M430 245 V265"/>
    <path d="M430 415 V435"/>
    <path d="M800 245 V265"/>
    <path d="M800 415 V435"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#334155">
    <text x="438" y="260">Hasil login</text>
    <text x="438" y="430">Permintaan data</text>
    <text x="808" y="260">Data penjualan</text>
    <text x="808" y="430">Mutasi stok</text>
  </g>

  <!-- Right-side actors -->
  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M950 170 H1370"/>
    <path d="M950 340 H1370"/>
    <path d="M950 510 H1370"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#334155">
    <text x="1025" y="158">Konfirmasi pembelian</text>
    <text x="1025" y="328">Data struk &amp; customer</text>
    <text x="1025" y="498">Permintaan &amp; status QRIS</text>
  </g>

  <!-- Data stores -->
  <g font-family="Arial, sans-serif" stroke="#475569" stroke-width="2" fill="#ffffff">
    <rect x="40" y="730" width="280" height="90"/>
    <rect x="360" y="730" width="280" height="90"/>
    <rect x="680" y="730" width="280" height="90"/>
    <rect x="1000" y="730" width="280" height="90"/>
    <rect x="1320" y="730" width="240" height="90"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">
    <text x="180" y="765">D1 - USERS &amp; AUDIT_LOGS</text>
    <text x="500" y="765">D2 - MASTER DATA</text>
    <text x="820" y="765">D3 - PEMBELIAN &amp; BATCH</text>
    <text x="1140" y="765">D4 - PENJUALAN</text>
    <text x="1440" y="765">D5 - INVENTORY</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#475569" font-size="12">
    <text x="180" y="793">users, audit_logs</text>
    <text x="500" y="793">categories, suppliers, customers</text>
    <text x="820" y="793">purchases, purchase_details, batches</text>
    <text x="1140" y="793">transactions, transaction_details</text>
    <text x="1440" y="793">products, stock_movements</text>
  </g>

  <!-- Store-to-process arrows: explicit downward direction -->
  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M430 585 V670 H180 V730"/>
    <path d="M430 585 V670 H500 V730"/>
    <path d="M430 585 V670 H820 V730"/>
    <path d="M800 585 V670 H1140 V730"/>
    <path d="M800 585 V670 H1440 V730"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#334155">
    <text x="430" y="628">Akun, master, pembelian, penjualan, dan stok disimpan ke data store</text>
  </g>

  <!-- Legend -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#475569">
    <rect x="470" y="870" width="660" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="800" y="900" text-anchor="middle" font-weight="700" fill="#0f172a">Keterangan Simbol</text>
    <text x="800" y="924" text-anchor="middle">Kotak = Entitas Luar  |  Oval = Proses  |  Persegi Panjang = Penyimpanan Data</text>
    <text x="800" y="944" text-anchor="middle">Ujung panah segitiga menunjukkan arah aliran data</text>
  </g>
</svg>
